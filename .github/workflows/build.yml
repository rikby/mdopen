name: Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check

  build-binaries:
    needs: check
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            os: macos-13
            target: bun-darwin-x64
            outfile: dist/mdopen-darwin-x64
            artifact: mdopen-darwin-x64
            smoke: true

          - name: macOS arm64
            os: macos-14
            target: bun-darwin-arm64
            outfile: dist/mdopen-darwin-arm64
            artifact: mdopen-darwin-arm64
            smoke: true

          - name: Linux x64
            os: ubuntu-latest
            target: bun-linux-x64-baseline
            outfile: dist/mdopen-linux-x64
            artifact: mdopen-linux-x64
            smoke: true

          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: bun-linux-arm64
            outfile: dist/mdopen-linux-arm64
            artifact: mdopen-linux-arm64
            smoke: true

          - name: Linux x64 musl
            os: ubuntu-latest
            target: bun-linux-x64-musl
            outfile: dist/mdopen-linux-x64-musl
            artifact: mdopen-linux-x64-musl
            smoke: false

          - name: Linux arm64 musl
            os: ubuntu-24.04-arm
            target: bun-linux-arm64-musl
            outfile: dist/mdopen-linux-arm64-musl
            artifact: mdopen-linux-arm64-musl
            smoke: false

          - name: Windows x64
            os: ubuntu-latest
            target: bun-windows-x64-baseline
            outfile: dist/mdopen-windows-x64.exe
            artifact: mdopen-windows-x64
            smoke: false

          - name: Windows arm64
            os: ubuntu-latest
            target: bun-windows-aarch64
            outfile: dist/mdopen-windows-arm64.exe
            artifact: mdopen-windows-arm64
            smoke: false

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun scripts/build-binary.js --target "${{ matrix.target }}" --outfile "${{ matrix.outfile }}"
        shell: bash

      - name: Smoke test native binary
        if: matrix.smoke
        run: MDOPEN_NO_OPEN=1 "${{ matrix.outfile }}" README.md
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.outfile }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
