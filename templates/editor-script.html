  <script>
    (function () {
      var pencilButton = document.getElementById('mdopen-editor-toggle');
      var article = document.querySelector('.markdown-body');
      if (!pencilButton || !article) return;

      var panel = null;
      var textarea = null;
      var debounceTimer = null;
      var md = null;
      var scriptsLoaded = false;
      var mermaidLoaded = false;
      var mermaidModule = null;
      var mermaidRenderCounter = 0;
      var isOpen = false;
      var savedContent = null;
      var panelWidth = 40;
      var divider = null;
      var hasFileSystem = 'showOpenFilePicker' in window;
      var fileHandle = null;
      var lastSavedContent = '';
      var dirtyDot = null;
      var openBtn = null;
      var saveBtn = null;

      var sampleContent = [
        '# mdopen Editor',
        '',
        'Welcome to the live Markdown editor.',
        '',
        '## Features',
        '',
        '- **Bold** and *italic* text',
        '- `Inline code` and code blocks',
        '- Lists, blockquotes, and more',
        '',
        '> This is a blockquote.',
        '',
        '## Code Example',
        '',
        '```javascript',
        'function hello() {',
        '  console.log("Hello, world!");',
        '}',
        '```',
        '',
        '---',
        '',
        '## Diagram',
        '',
        '```mermaid',
        'graph LR',
        '    MD[Markdown file] -->|mdopen| HTML[Styled HTML]',
        '    HTML --> Browser[Browser]',
        '    Browser -->|read| You[Reader 😊]',
        '```',
        '',
        'Edit on the left, preview updates on the right after a brief pause.',
        '',
        'Visit [mdopen on GitHub](https://github.com/rikby/mdopen) for more info.',
      ].join('\n');

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function enhanceHtml(value) {
        return value.replace(
          /<blockquote>\s*<p>\[!(NOTE|TIP|WARNING|IMPORTANT)\]\s*(?:<br>\s*)?([\s\S]*?)<\/blockquote>/gi,
          function (match, type, body) {
            return '<section class="callout ' + type.toLowerCase() + '"><p class="callout-title">' + type + '</p><p>' + body + '</section>';
          }
        );
      }

      function extractFrontmatter(value) {
        if (value.indexOf('---\n') !== 0 && value.indexOf('---\r\n') !== 0) {
          return { frontmatter: '', body: value };
        }

        var marker = value.indexOf('---\r\n') === 0 ? '---\r\n' : '---\n';
        var searchIndex = marker.length;
        while (searchIndex < value.length) {
          var nextLineIndex = value.indexOf('\n', searchIndex);
          var lineEnd = nextLineIndex === -1 ? value.length : nextLineIndex + 1;
          var line = value.slice(searchIndex, lineEnd).replace(/\r?\n$/, '');

          if (line === '---') {
            return {
              frontmatter: value.slice(marker.length, searchIndex).replace(/\r?\n$/, ''),
              body: value.slice(lineEnd)
            };
          }

          if (nextLineIndex === -1) break;
          searchIndex = lineEnd;
        }

        return { frontmatter: '', body: value };
      }

      function renderFrontmatter(value) {
        if (!value.trim()) return '';
        return [
          '<details class="mdopen-frontmatter">',
          '<summary>Frontmatter</summary>',
          '<pre><code>' + escapeHtml(value) + '</code></pre>',
          '</details>'
        ].join('');
      }

      function loadScripts(callback) {
        if (scriptsLoaded) {
          callback();
          return;
        }

        var remaining = 2;
        function done() {
          remaining -= 1;
          if (remaining === 0) {
            scriptsLoaded = true;
            callback();
          }
        }

        var hljsScript = document.createElement('script');
        hljsScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js';
        hljsScript.onload = done;
        hljsScript.onerror = done;
        document.head.appendChild(hljsScript);

        var mditScript = document.createElement('script');
        mditScript.src = 'https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js';
        mditScript.onload = done;
        mditScript.onerror = done;
        document.head.appendChild(mditScript);
      }

      function loadPlugins(callback) {
        var plugins = [
          'https://cdn.jsdelivr.net/npm/markdown-it-deflist@3.0.0/dist/markdown-it-deflist.min.js',
          'https://cdn.jsdelivr.net/npm/markdown-it-footnote@4.0.0/dist/markdown-it-footnote.min.js',
          'https://cdn.jsdelivr.net/npm/markdown-it-mark@4.0.0/dist/markdown-it-mark.min.js',
          'https://cdn.jsdelivr.net/npm/markdown-it-sub@2.0.0/dist/markdown-it-sub.min.js',
          'https://cdn.jsdelivr.net/npm/markdown-it-sup@2.0.0/dist/markdown-it-sup.min.js',
          'https://cdn.jsdelivr.net/npm/markdown-it-task-lists@2.1.1/dist/markdown-it-task-lists.min.js',
        ];

        var loaded = 0;
        function check() {
          loaded += 1;
          if (loaded === plugins.length) callback();
        }

        plugins.forEach(function (url) {
          var s = document.createElement('script');
          s.src = url;
          s.onload = check;
          s.onerror = check;
          document.head.appendChild(s);
        });
      }

      function initMarkdownIt() {
        if (md) return;

        var hljs = window.hljs;

        md = window.markdownit({
          html: true,
          linkify: true,
          typographer: true,
          highlight: function (code, language) {
            var normalizedLanguage = language && language.trim();
            if (normalizedLanguage && hljs && hljs.getLanguage(normalizedLanguage)) {
              try {
                var highlighted = hljs.highlight(code, {
                  language: normalizedLanguage,
                  ignoreIllegals: true,
                }).value;
                return '<pre><code class="hljs language-' + escapeHtml(normalizedLanguage) + '">' + highlighted + '</code></pre>';
              } catch (e) {
                /* fall through */
              }
            }
            return '<pre><code class="hljs">' + escapeHtml(code) + '</code></pre>';
          },
        });

        var mermaidCounter = 0;
        var defaultFence = md.renderer.rules.fence ||
          function (tokens, idx, options, env, self) { return self.renderToken(tokens, idx, options); };

        md.renderer.rules.fence = function (tokens, idx, options, env, self) {
          var token = tokens[idx];
          var language = token.info.trim().split(/\s+/)[0];
          if (language === 'mermaid') {
            var id = 'mermaid-diagram-' + (++mermaidCounter);
            return [
              '<div class="mermaid-container" data-mermaid-id="' + id + '">',
              '<button type="button" class="mermaid-fullscreen-btn" aria-label="Open diagram fullscreen">Full</button>',
              '<div class="mermaid" id="' + id + '">' + escapeHtml(token.content) + '</div>',
              '</div>',
            ].join('');
          }
          return defaultFence(tokens, idx, options, env, self);
        };

        if (window.markdownitDeflist) md.use(window.markdownitDeflist);
        if (window.markdownitFootnote) md.use(window.markdownitFootnote);
        if (window.markdownitMark) md.use(window.markdownitMark);
        if (window.markdownitSub) md.use(window.markdownitSub);
        if (window.markdownitSup) md.use(window.markdownitSup);
        if (window.markdownitTaskLists) md.use(window.markdownitTaskLists, { enabled: true, label: true });

        var defaultHeadingOpen = md.renderer.rules.heading_open ||
          function (tokens, idx, options, env, self) { return self.renderToken(tokens, idx, options); };
        md.renderer.rules.heading_open = function (tokens, idx, options, env, self) {
          tokens[idx].attrSet('data-source-line', tokens[idx + 1].map ? tokens[idx + 1].map[0] : 0);
          return defaultHeadingOpen(tokens, idx, options, env, self);
        };
      }

      function hasMermaidFence(text) {
        return /^```mermaid\b/m.test(text);
      }

      function loadMermaid(callback) {
        if (mermaidLoaded) {
          callback();
          return;
        }

        var s = document.createElement('script');
        s.type = 'module';
        s.textContent = [
          'import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";',
          'window._mdopenMermaid = mermaid;',
          'document.dispatchEvent(new Event("mdopen-mermaid-loaded"));',
        ].join('\n');
        document.head.appendChild(s);

        document.addEventListener('mdopen-mermaid-loaded', function onLoaded() {
          document.removeEventListener('mdopen-mermaid-loaded', onLoaded);
          mermaidModule = window._mdopenMermaid;
          mermaidLoaded = true;
          callback();
        });
      }

      function renderMermaidDiagrams() {
        if (!mermaidModule) return;

        var theme = document.documentElement.dataset.mdopenTheme === 'dark' ? 'dark' : 'default';
        mermaidModule.initialize({
          startOnLoad: false,
          theme: theme,
          securityLevel: 'strict',
          fontFamily: 'ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif',
        });

        var containers = document.querySelectorAll('.mermaid-container');
        containers.forEach(function (container) {
          var diagram = container.querySelector('.mermaid');
          if (!diagram) return;

          if (!diagram.dataset.source) {
            diagram.dataset.source = diagram.textContent || '';
          }

          diagram.classList.remove('mermaid-error');
          diagram.removeAttribute('data-processed');
          diagram.textContent = diagram.dataset.source;

          mermaidModule.render(diagram.id + '-svg-' + (++mermaidRenderCounter), diagram.dataset.source)
            .then(function (result) {
              diagram.innerHTML = result.svg;
              if (result.bindFunctions) result.bindFunctions(diagram);
            })
            .catch(function (error) {
              diagram.classList.add('mermaid-error');
              diagram.textContent = 'Mermaid render failed: ' + (error.message || error);
            });
        });
      }

      function render() {
        if (!md || !textarea) return;
        var text = textarea.value;
        var parsed = extractFrontmatter(text);
        var html = renderFrontmatter(parsed.frontmatter) + enhanceHtml(md.render(parsed.body));
        article.innerHTML = html;

        if (hasMermaidFence(parsed.body)) {
          loadMermaid(function () {
            renderMermaidDiagrams();
          });
        }
      }

      function scheduleRender() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(render, 1000);
      }

      function openFile() {
        window.showOpenFilePicker({
          types: [{
            description: 'Markdown',
            accept: { 'text/markdown': ['.md', '.markdown'] }
          }]
        }).then(function (handles) {
          var handle = handles[0];
          return handle.getFile().then(function (file) {
            return file.text().then(function (text) {
              fileHandle = handle;
              lastSavedContent = text;
              if (textarea) {
                textarea.value = text;
              }
              if (saveBtn) {
                saveBtn.style.display = '';
              }
              updateDirtyState();
              render();
            });
          });
        }).catch(function () {
          // User cancelled picker or error
        });
      }

      function saveFile() {
        if (!fileHandle || !textarea) return;
        fileHandle.createWritable().then(function (writable) {
          return writable.write(textarea.value).then(function () {
            return writable.close();
          });
        }).then(function () {
          lastSavedContent = textarea.value;
          updateDirtyState();
          if (saveBtn) {
            var original = saveBtn.textContent;
            saveBtn.textContent = '✓';
            setTimeout(function () {
              saveBtn.textContent = original;
            }, 1200);
          }
        }).catch(function () {
          // Save failed
        });
      }

      function updateDirtyState() {
        if (!dirtyDot) return;
        if (!fileHandle) {
          dirtyDot.style.display = 'none';
          return;
        }
        var dirty = textarea && textarea.value !== lastSavedContent;
        dirtyDot.style.display = dirty ? '' : 'none';
      }

      function syncScroll() {
        if (!textarea) return;
        var article = document.querySelector('.markdown-body');
        if (!article) return;

        var lineCount = textarea.value.substring(0, textarea.selectionStart).split('\n').length - 1;
        var approximateTopLine = Math.floor(textarea.scrollTop / 21);

        var headings = article.querySelectorAll('[data-source-line]');
        if (headings.length === 0) return;

        var best = headings[0];
        var bestDist = Infinity;
        for (var i = 0; i < headings.length; i++) {
          var line = parseInt(headings[i].getAttribute('data-source-line'), 10);
          var dist = Math.abs(line - approximateTopLine);
          if (dist < bestDist) {
            bestDist = dist;
            best = headings[i];
          }
        }

        article.scrollTop = best.offsetTop - article.offsetTop - 16;
      }

      function createPanel() {
        if (panel) return;

        panel = document.createElement('div');
        panel.className = 'mdopen-editor-panel';

        var header = document.createElement('div');
        header.className = 'mdopen-editor-header';
        var backLink = document.createElement('a');
        backLink.href = 'https://rikby.github.io/mdopen/';
        backLink.className = 'mdopen-editor-back';
        backLink.textContent = '← mdopen';
        header.appendChild(backLink);

        if (hasFileSystem) {
          openBtn = document.createElement('button');
          openBtn.type = 'button';
          openBtn.className = 'mdopen-editor-open';
          openBtn.textContent = '\uD83D\uDCC2';
          openBtn.title = 'Open file (Ctrl+O)';
          openBtn.addEventListener('click', openFile);
          header.appendChild(openBtn);

          saveBtn = document.createElement('button');
          saveBtn.type = 'button';
          saveBtn.className = 'mdopen-editor-save';
          saveBtn.textContent = '\uD83D\uDCBE';
          saveBtn.title = 'Save file (Ctrl+S)';
          saveBtn.style.display = 'none';
          saveBtn.addEventListener('click', saveFile);
          header.appendChild(saveBtn);

          dirtyDot = document.createElement('span');
          dirtyDot.className = 'mdopen-editor-dirty';
          dirtyDot.textContent = '\u2022';
          dirtyDot.style.display = 'none';
          header.appendChild(dirtyDot);
        }

        panel.appendChild(header);

        textarea = document.createElement('textarea');
        textarea.placeholder = 'Type Markdown here...';
        textarea.spellcheck = false;
        textarea.value = savedContent !== null ? savedContent : sampleContent;

        textarea.addEventListener('input', function () {
          scheduleRender();
          updateDirtyState();
        });

        textarea.addEventListener('scroll', syncScroll);

        textarea.addEventListener('keydown', function (event) {
          if (event.key === 'Tab') {
            event.preventDefault();
            var start = textarea.selectionStart;
            var end = textarea.selectionEnd;
            textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + 2;
            scheduleRender();
          }
        });

        panel.style.width = panelWidth + '%';
        panel.appendChild(textarea);

        divider = document.createElement('div');
        divider.className = 'mdopen-editor-divider';
        document.body.appendChild(divider);

        initDividerDrag();
        applyPanelWidth();

        document.body.insertBefore(panel, document.body.firstChild);
      }

      function applyPanelWidth() {
        var article = document.querySelector('.markdown-body');
        if (!panel || !article) return;
        panel.style.width = panelWidth + '%';
        article.style.marginLeft = panelWidth + '%';
        article.style.width = (100 - panelWidth) + '%';
        if (divider) divider.style.left = panelWidth + '%';
      }

      function initDividerDrag() {
        if (!divider) return;
        var dragging = false;
        divider.addEventListener('mousedown', function (e) {
          e.preventDefault();
          dragging = true;
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
        });
        document.addEventListener('mousemove', function (e) {
          if (!dragging) return;
          var vw = window.innerWidth;
          var pct = (e.clientX / vw) * 100;
          panelWidth = Math.max(20, Math.min(80, pct));
          applyPanelWidth();
        });
        document.addEventListener('mouseup', function () {
          if (!dragging) return;
          dragging = false;
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        });
      }

      function openEditor() {
        if (isOpen) return;
        isOpen = true;
        document.documentElement.dataset.mdopenEditor = 'open';
        pencilButton.setAttribute('aria-pressed', 'true');

        createPanel();

        loadScripts(function () {
          loadPlugins(function () {
            initMarkdownIt();
            render();
          });
        });
      }

      function closeEditor() {
        if (!isOpen) return;
        isOpen = false;
        document.documentElement.removeAttribute('data-mdopen-editor');
        pencilButton.setAttribute('aria-pressed', 'false');

        if (panel) {
          if (textarea) savedContent = textarea.value;
          panel.remove();
          panel = null;
          textarea = null;
          openBtn = null;
          saveBtn = null;
          dirtyDot = null;
          if (divider) { divider.remove(); divider = null; }
          var article = document.querySelector('.markdown-body');
          if (article) { article.style.marginLeft = ''; article.style.width = ''; }
        }

        clearTimeout(debounceTimer);
      }

      pencilButton.addEventListener('click', function () {
        if (isOpen) {
          closeEditor();
        } else {
          openEditor();
        }
      });

      document.addEventListener('keydown', function (event) {
        if (!isOpen) return;
        if ((event.ctrlKey || event.metaKey) && event.key === 's') {
          event.preventDefault();
          saveFile();
        }
        if ((event.ctrlKey || event.metaKey) && event.key === 'o') {
          event.preventDefault();
          if (hasFileSystem) openFile();
        }
      });

      // Auto-open on editor pages (edit.html)
      openEditor();
    }());
  </script>
