<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{pageTitle}}</title>
  <link id="mdopen-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown-light.min.css">
  <link rel="stylesheet" href="{{cssHref}}">
  <link rel="stylesheet" href="demo.css">
  <link rel="stylesheet" href="readthedocs.css">
  <link rel="stylesheet" href="mdopen-overrides.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <nav class="mdopen-toolbar" aria-label="View and print controls">
    <button type="button" id="mdopen-editor-toggle" class="mdopen-editor-button" aria-label="Open editor" aria-pressed="false" title="Open editor" data-mdopen-editor-hidden>✏️</button>
    <button type="button" id="mdopen-theme-toggle" class="mdopen-theme-button" aria-label="Switch to dark theme" aria-pressed="false" title="Switch to dark theme">☀</button>
    <button type="button" id="mdopen-copy-rich-button" class="mdopen-copy-rich-button" aria-label="Copy rich document" title="Copy rich document">⧉</button>
    <button type="button" id="mdopen-print-button" class="mdopen-print-button" aria-label="Print document" title="Print document">🖨</button>
    <button type="button" id="mdopen-menu-toggle" class="mdopen-menu-button" aria-label="View options" aria-expanded="false" aria-controls="mdopen-menu-panel"><span aria-hidden="true"></span></button>
    <div id="mdopen-menu-panel" class="mdopen-menu-panel" hidden>
      <button type="button" id="mdopen-pin-toggle" class="mdopen-pin-button" aria-label="Pin menu open" aria-pressed="false" title="Pin menu open">📍</button>
      <fieldset class="mdopen-option-group">
        <legend>Copy</legend>
        <div class="mdopen-segmented" aria-label="Copy document">
          <button type="button" data-mdopen-copy="rich">Rich</button>
          <button type="button" data-mdopen-copy="plain">Plain text</button>
          <button type="button" data-mdopen-copy="docs">Google Docs</button>
        </div>
      </fieldset>
      <fieldset class="mdopen-option-group">
        <legend>Theme</legend>
        <div class="mdopen-segmented" aria-label="Theme style">
          <button type="button" data-mdopen-control="style" data-mdopen-value="default">Default</button>
          <button type="button" data-mdopen-control="style" data-mdopen-value="demo">Demo</button>
          <button type="button" data-mdopen-control="style" data-mdopen-value="readthedocs">Read the Docs</button>
        </div>
      </fieldset>
      <fieldset class="mdopen-option-group">
        <legend>Font</legend>
        <div class="mdopen-button-grid" aria-label="Font theme">
          <button type="button" data-mdopen-control="font" data-mdopen-value="source">Source</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="system">System</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="balanced">Balanced</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="print">Print serif</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="technical">Technical</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="editorial">Editorial</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="product">Product</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="mono">Mono</button>
        </div>
      </fieldset>
      <fieldset class="mdopen-option-group">
        <legend>Tone</legend>
        <div class="mdopen-segmented" aria-label="Grayscale tone">
          <button type="button" data-mdopen-control="tone" data-mdopen-value="default">Default</button>
          <button type="button" data-mdopen-control="tone" data-mdopen-value="black">Black</button>
          <button type="button" data-mdopen-control="tone" data-mdopen-value="graphite">Graphite</button>
          <button type="button" data-mdopen-control="tone" data-mdopen-value="slate">Slate</button>
          <button type="button" data-mdopen-control="tone" data-mdopen-value="ash">Ash</button>
        </div>
      </fieldset>
      <fieldset class="mdopen-option-group">
        <legend>Color</legend>
        <div class="mdopen-segmented" aria-label="Color accent">
          <button type="button" data-mdopen-control="accent" data-mdopen-value="default">Default</button>
          <button type="button" data-mdopen-control="accent" data-mdopen-value="none">None</button>
          <button type="button" data-mdopen-control="accent" data-mdopen-value="blue">Blue</button>
          <button type="button" data-mdopen-control="accent" data-mdopen-value="sage">Sage</button>
          <button type="button" data-mdopen-control="accent" data-mdopen-value="rose">Rose</button>
        </div>
      </fieldset>
      <fieldset class="mdopen-option-group">
        <legend>Gap</legend>
        <div class="mdopen-segmented" aria-label="Content gap">
          <button type="button" data-mdopen-control="density" data-mdopen-value="normal">Normal</button>
          <button type="button" data-mdopen-control="density" data-mdopen-value="tight">-1</button>
          <button type="button" data-mdopen-control="density" data-mdopen-value="dense">-2</button>
          <button type="button" data-mdopen-control="density" data-mdopen-value="compact">-3</button>
        </div>
      </fieldset>
    </div>
  </nav>
  <article class="markdown-body">
{{body}}
  </article>
  <a class="mdopen-github-link" href="https://github.com/rikby/mdopen" target="_blank" rel="noopener noreferrer" aria-label="Open mdopen on GitHub">
    <span class="mdopen-github-label">MDopen</span>
    <svg aria-hidden="true" viewBox="0 0 16 16" width="20" height="20">
      <path fill="currentColor" d="M8 0C3.58 0 0 3.67 0 8.2c0 3.62 2.29 6.69 5.47 7.77.4.08.55-.18.55-.4 0-.2-.01-.86-.01-1.56-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.15-.28-.15-.68-.52-.01-.53.63-.01 1.08.59 1.23.84.72 1.24 1.87.89 2.33.68.07-.53.28-.89.51-1.09-1.78-.21-3.64-.91-3.64-4.03 0-.89.31-1.62.82-2.19-.08-.21-.36-1.04.08-2.16 0 0 .67-.22 2.2.84A7.4 7.4 0 0 1 8 3.99c.68 0 1.36.09 2 .27 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.95.08 2.16.51.57.82 1.3.82 2.19 0 3.13-1.87 3.82-3.65 4.03.29.26.54.75.54 1.52 0 1.09-.01 1.97-.01 2.24 0 .22.15.48.55.4A8.12 8.12 0 0 0 16 8.2C16 3.67 12.42 0 8 0Z"/>
    </svg>
  </a>
{{mdopenScript}}
{{editorScript}}
{{mermaidScript}}
</body>
</html>
