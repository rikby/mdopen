<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{pageTitle}}</title>
  <link id="mdopen-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown-light.min.css">
  <link rel="stylesheet" href="{{cssHref}}">
  <link rel="stylesheet" href="demo.css">
  <link rel="stylesheet" href="readthedocs.css">
  <link rel="stylesheet" href="mdopen-overrides.css">
</head>
<body>
  <nav class="mdopen-toolbar" aria-label="View and print controls">
    <button type="button" id="mdopen-theme-toggle" class="mdopen-theme-button" aria-label="Switch to dark theme" aria-pressed="false" title="Switch to dark theme">☀</button>
    <button type="button" id="mdopen-copy-rich-button" class="mdopen-copy-rich-button" aria-label="Copy rich document" title="Copy rich document">⧉</button>
    <button type="button" id="mdopen-print-button" class="mdopen-print-button" aria-label="Print document" title="Print document">🖨</button>
    <button type="button" id="mdopen-menu-toggle" class="mdopen-menu-button" aria-label="View options" aria-expanded="false" aria-controls="mdopen-menu-panel"><span aria-hidden="true"></span></button>
    <div id="mdopen-menu-panel" class="mdopen-menu-panel" hidden>
      <button type="button" id="mdopen-pin-toggle" class="mdopen-pin-button" aria-label="Pin menu open" aria-pressed="false" title="Pin menu open">📍</button>
      <fieldset class="mdopen-option-group">
        <legend>Theme</legend>
        <div class="mdopen-segmented" aria-label="Theme style">
          <button type="button" data-mdopen-control="style" data-mdopen-value="default">Default</button>
          <button type="button" data-mdopen-control="style" data-mdopen-value="demo">Demo</button>
          <button type="button" data-mdopen-control="style" data-mdopen-value="readthedocs">Read the Docs</button>
        </div>
      </fieldset>
      <fieldset class="mdopen-option-group">
        <legend>Font</legend>
        <div class="mdopen-button-grid" aria-label="Font theme">
          <button type="button" data-mdopen-control="font" data-mdopen-value="source">Source</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="system">System</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="balanced">Balanced</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="print">Print serif</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="technical">Technical</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="editorial">Editorial</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="product">Product</button>
          <button type="button" data-mdopen-control="font" data-mdopen-value="mono">Mono</button>
        </div>
      </fieldset>
      <fieldset class="mdopen-option-group">
        <legend>Tone</legend>
        <div class="mdopen-segmented" aria-label="Grayscale tone">
          <button type="button" data-mdopen-control="tone" data-mdopen-value="default">Default</button>
          <button type="button" data-mdopen-control="tone" data-mdopen-value="black">Black</button>
          <button type="button" data-mdopen-control="tone" data-mdopen-value="graphite">Graphite</button>
          <button type="button" data-mdopen-control="tone" data-mdopen-value="slate">Slate</button>
          <button type="button" data-mdopen-control="tone" data-mdopen-value="ash">Ash</button>
        </div>
      </fieldset>
      <fieldset class="mdopen-option-group">
        <legend>Color</legend>
        <div class="mdopen-segmented" aria-label="Color accent">
          <button type="button" data-mdopen-control="accent" data-mdopen-value="default">Default</button>
          <button type="button" data-mdopen-control="accent" data-mdopen-value="none">None</button>
          <button type="button" data-mdopen-control="accent" data-mdopen-value="blue">Blue</button>
          <button type="button" data-mdopen-control="accent" data-mdopen-value="sage">Sage</button>
          <button type="button" data-mdopen-control="accent" data-mdopen-value="rose">Rose</button>
        </div>
      </fieldset>
      <fieldset class="mdopen-option-group">
        <legend>Gap</legend>
        <div class="mdopen-segmented" aria-label="Content gap">
          <button type="button" data-mdopen-control="density" data-mdopen-value="normal">Normal</button>
          <button type="button" data-mdopen-control="density" data-mdopen-value="tight">-1</button>
          <button type="button" data-mdopen-control="density" data-mdopen-value="dense">-2</button>
          <button type="button" data-mdopen-control="density" data-mdopen-value="compact">-3</button>
        </div>
      </fieldset>
    </div>
  </nav>
  <article class="markdown-body">
{{body}}
  </article>
  <a class="mdopen-github-link" href="https://github.com/rikby/mdopen" target="_blank" rel="noopener noreferrer" aria-label="Open mdopen on GitHub">
    <span class="mdopen-github-label">MDopen</span>
    <svg aria-hidden="true" viewBox="0 0 16 16" width="20" height="20">
      <path fill="currentColor" d="M8 0C3.58 0 0 3.67 0 8.2c0 3.62 2.29 6.69 5.47 7.77.4.08.55-.18.55-.4 0-.2-.01-.86-.01-1.56-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.15-.28-.15-.68-.52-.01-.53.63-.01 1.08.59 1.23.84.72 1.24 1.87.89 2.33.68.07-.53.28-.89.51-1.09-1.78-.21-3.64-.91-3.64-4.03 0-.89.31-1.62.82-2.19-.08-.21-.36-1.04.08-2.16 0 0 .67-.22 2.2.84A7.4 7.4 0 0 1 8 3.99c.68 0 1.36.09 2 .27 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.95.08 2.16.51.57.82 1.3.82 2.19 0 3.13-1.87 3.82-3.65 4.03.29.26.54.75.54 1.52 0 1.09-.01 1.97-.01 2.24 0 .22.15.48.55.4A8.12 8.12 0 0 0 16 8.2C16 3.67 12.42 0 8 0Z"/>
    </svg>
  </a>
  <script>
    (function () {
      var styles = {
        light: 'https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown-light.min.css',
        dark: 'https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown-dark.min.css'
      };
      var link = document.getElementById('mdopen-theme');
      var toolbar = document.querySelector('.mdopen-toolbar');
      var article = document.querySelector('.markdown-body');
      var themeToggle = document.getElementById('mdopen-theme-toggle');
      var copyRichButton = document.getElementById('mdopen-copy-rich-button');
      var printButton = document.getElementById('mdopen-print-button');
      var menuToggle = document.getElementById('mdopen-menu-toggle');
      var menuPanel = document.getElementById('mdopen-menu-panel');
      var pinToggle = document.getElementById('mdopen-pin-toggle');

      function setMenuOpen(open, restoreFocus) {
        menuPanel.hidden = !open;
        menuToggle.setAttribute('aria-expanded', String(open));
        if (!open && restoreFocus) menuToggle.focus();
      }

      function syncHeadingFontPreview() {
        var heading = document.querySelector('.markdown-body h1') || document.querySelector('.markdown-body');
        if (!heading || !window.getComputedStyle) return;
        var activeFont = document.documentElement.dataset.mdopenFont;
        delete document.documentElement.dataset.mdopenFont;
        var style = window.getComputedStyle(heading);
        document.documentElement.style.setProperty('--mdopen-source-h1-font-family', style.fontFamily);
        document.documentElement.style.setProperty('--mdopen-source-h1-font-weight', style.fontWeight);
        document.documentElement.style.setProperty('--mdopen-source-h1-letter-spacing', style.letterSpacing);
        if (activeFont) document.documentElement.dataset.mdopenFont = activeFont;
      }

      function queueHeadingFontPreview() {
        window.requestAnimationFrame(syncHeadingFontPreview);
      }

      function updatePressed(control, value) {
        var buttons = menuPanel.querySelectorAll('[data-mdopen-control="' + control + '"]');
        Array.prototype.forEach.call(buttons, function (button) {
          button.setAttribute('aria-pressed', String(button.dataset.mdopenValue === value));
        });
      }

      function setMenuPinned(pinned) {
        localStorage.setItem('mdopen-autohide-menu', pinned ? 'false' : 'true');
        pinToggle.setAttribute('aria-pressed', String(pinned));
        pinToggle.textContent = pinned ? '📌' : '📍';
        pinToggle.setAttribute('aria-label', pinned ? 'Unpin menu' : 'Pin menu open');
        pinToggle.setAttribute('title', pinned ? 'Unpin menu' : 'Pin menu open');
      }

      function setTheme(theme) {
        if (!styles[theme]) theme = 'light';
        document.documentElement.dataset.mdopenTheme = theme;
        link.href = styles[theme];
        localStorage.setItem('mdopen-theme', theme);
        themeToggle.setAttribute('aria-pressed', String(theme === 'dark'));
        themeToggle.textContent = theme === 'dark' ? '☾' : '☀';
        themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
        themeToggle.setAttribute('title', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
        document.dispatchEvent(new CustomEvent('mdopen-theme-change'));
        queueHeadingFontPreview();
      }

      function setDensity(density) {
        if (['normal', 'tight', 'dense', 'compact'].indexOf(density) === -1) density = 'normal';
        document.documentElement.dataset.mdopenDensity = density;
        localStorage.setItem('mdopen-density', density);
        updatePressed('density', density);
      }

      function setStyle(style) {
        if (['default', 'demo', 'readthedocs'].indexOf(style) === -1) style = 'default';
        document.documentElement.dataset.mdopenStyle = style;
        localStorage.setItem('mdopen-style', style);
        updatePressed('style', style);
        queueHeadingFontPreview();
      }

      function setTone(tone) {
        if (['default', 'black', 'graphite', 'slate', 'ash'].indexOf(tone) === -1) tone = 'default';
        if (tone === 'default') {
          delete document.documentElement.dataset.mdopenTone;
        } else {
          document.documentElement.dataset.mdopenTone = tone;
        }
        localStorage.setItem('mdopen-tone', tone);
        updatePressed('tone', tone);
      }

      function setAccent(accent) {
        if (['default', 'none', 'blue', 'sage', 'rose'].indexOf(accent) === -1) accent = 'default';
        if (accent === 'default') {
          delete document.documentElement.dataset.mdopenAccent;
        } else {
          document.documentElement.dataset.mdopenAccent = accent;
        }
        localStorage.setItem('mdopen-accent', accent);
        updatePressed('accent', accent);
      }

      function setFont(font) {
        if (['source', 'system', 'balanced', 'print', 'technical', 'editorial', 'product', 'mono'].indexOf(font) === -1) font = 'source';
        document.documentElement.dataset.mdopenFont = font;
        localStorage.setItem('mdopen-font', font);
        updatePressed('font', font);
        queueHeadingFontPreview();
      }

      function getDocumentCopyHtml() {
        var clone = article.cloneNode(true);
        Array.prototype.forEach.call(clone.querySelectorAll('.mermaid-fullscreen-btn'), function (button) {
          button.remove();
        });
        return '<!doctype html><html><body>' + clone.outerHTML + '</body></html>';
      }

      function copyDocumentSelection() {
        var selection = window.getSelection();
        var previousRanges = [];
        if (selection) {
          for (var index = 0; index < selection.rangeCount; index += 1) {
            previousRanges.push(selection.getRangeAt(index));
          }
        }

        var range = document.createRange();
        range.selectNodeContents(article);
        if (!selection) throw new Error('Browser selection is unavailable.');
        selection.removeAllRanges();
        selection.addRange(range);
        var copied = document.execCommand('copy');
        selection.removeAllRanges();
        previousRanges.forEach(function (previousRange) {
          selection.addRange(previousRange);
        });

        if (!copied) throw new Error('Browser copy command failed.');
      }

      function setCopyRichStatus(copied) {
        copyRichButton.textContent = copied ? '✓' : '⧉';
        copyRichButton.setAttribute('aria-label', copied ? 'Rich document copied' : 'Copy rich document');
        copyRichButton.setAttribute('title', copied ? 'Rich document copied' : 'Copy rich document');
        if (copied) {
          window.setTimeout(function () {
            setCopyRichStatus(false);
          }, 1400);
        }
      }

      function copyRichDocument() {
        var html = getDocumentCopyHtml();
        var text = article.innerText;

        if (navigator.clipboard && window.ClipboardItem) {
          var item = new ClipboardItem({
            'text/html': new Blob([html], { type: 'text/html' }),
            'text/plain': new Blob([text], { type: 'text/plain' })
          });

          return navigator.clipboard.write([item]).catch(function () {
            copyDocumentSelection();
          }).then(function () {
            setCopyRichStatus(true);
          });
        }

        copyDocumentSelection();
        setCopyRichStatus(true);
        return Promise.resolve();
      }

      themeToggle.addEventListener('click', function () {
        setTheme(document.documentElement.dataset.mdopenTheme === 'dark' ? 'light' : 'dark');
      });

      copyRichButton.addEventListener('click', function () {
        copyRichDocument().catch(function () {
          copyRichButton.setAttribute('title', 'Copy failed');
        });
      });

      printButton.addEventListener('click', function () {
        window.print();
      });

      menuToggle.addEventListener('click', function () {
        setMenuOpen(menuPanel.hidden);
      });

      menuPanel.addEventListener('click', function (event) {
        var button = event.target.closest('button[data-mdopen-control]');
        if (!button) return;
        var value = button.dataset.mdopenValue;
        if (button.dataset.mdopenControl === 'style') setStyle(value);
        if (button.dataset.mdopenControl === 'font') setFont(value);
        if (button.dataset.mdopenControl === 'tone') setTone(value);
        if (button.dataset.mdopenControl === 'accent') setAccent(value);
        if (button.dataset.mdopenControl === 'density') setDensity(value);
      });

      pinToggle.addEventListener('click', function () {
        setMenuPinned(pinToggle.getAttribute('aria-pressed') !== 'true');
      });

      document.addEventListener('click', function (event) {
        if (!menuPanel.hidden && pinToggle.getAttribute('aria-pressed') !== 'true' && !toolbar.contains(event.target)) {
          setMenuOpen(false);
        }
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && !menuPanel.hidden) {
          setMenuOpen(false, true);
        }
      });

      var params = new URLSearchParams(window.location.search);
      var defaultStyle = '{{defaultStyle}}';
      setTheme(params.get('theme') || localStorage.getItem('mdopen-theme') || 'light');
      setStyle(params.get('style') || (defaultStyle !== 'default' ? defaultStyle : localStorage.getItem('mdopen-style')) || 'default');
      setTone(params.get('tone') || (defaultStyle !== 'default' ? 'default' : localStorage.getItem('mdopen-tone')) || 'default');
      setAccent(params.get('accent') || (defaultStyle !== 'default' ? 'default' : localStorage.getItem('mdopen-accent')) || 'default');
      setFont(params.get('font') || localStorage.getItem('mdopen-font') || 'source');
      setDensity(params.get('density') || localStorage.getItem('mdopen-density') || 'normal');
      setMenuPinned(localStorage.getItem('mdopen-autohide-menu') === 'false');
      link.addEventListener('load', queueHeadingFontPreview);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(queueHeadingFontPreview);
      }
      queueHeadingFontPreview();

      var themeBeforePrint = null;
      window.addEventListener('beforeprint', function () {
        themeBeforePrint = localStorage.getItem('mdopen-theme') || 'light';
        link.href = styles.light;
        document.documentElement.dataset.mdopenTheme = 'light';
      });
      window.addEventListener('afterprint', function () {
        setTheme(themeBeforePrint || localStorage.getItem('mdopen-theme') || 'light');
      });
    }());
  </script>
{{mermaidScript}}
</body>
</html>
