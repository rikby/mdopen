<script>
  // Shared Mermaid diagram overlay engine.
  //
  // Turns a .mermaid-container into a fixed full-viewport overlay on demand
  // (instead of the native Fullscreen API, which is unreliable under file://
  // and breaks the pan/zoom that should follow). Exposes window.mdopenMermaidOverlay
  // for the per-path mermaid loaders. Each loader sets onEnter/onExit hooks that
  // wire its own pan/zoom implementation; the overlay owns show/hide + Escape +
  // body scroll lock + button injection.
  (function () {
    if (window.mdopenMermaidOverlay) return;

    var EXPAND_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>';
    var MINIMIZE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 0 2-2h3M3 16h3a2 2 0 0 0 2 2v3"></path></svg>';

    var activeOverlayContainer = null;
    var previousBodyOverflow = "";
    var hooks = { onEnter: null, onExit: null };

    function isDarkMode() {
      return document.documentElement.dataset.mdopenTheme === "dark";
    }

    function setButtonState(container, isFullscreen) {
      var button = container.querySelector(".mermaid-fullscreen-btn");
      if (!button) return;
      button.innerHTML = isFullscreen ? MINIMIZE_ICON : EXPAND_ICON;
      button.setAttribute("aria-label", isFullscreen ? "Exit fullscreen" : "Enter fullscreen");
      button.setAttribute("aria-pressed", String(isFullscreen));
      button.title = isFullscreen ? "Exit fullscreen (scroll to zoom)" : "Enter fullscreen";
    }

    function applyFullscreenStyles(container) {
      container.style.position = "fixed";
      container.style.inset = "0";
      container.style.zIndex = "9999";
      container.style.width = "100vw";
      container.style.height = "100vh";
      container.style.margin = "0";
      container.style.padding = "48px";
      container.style.border = "0";
      container.style.borderRadius = "0";
      container.style.background = isDarkMode() ? "#0d1117" : "#ffffff";
      container.style.display = "flex";
      container.style.alignItems = "center";
      container.style.justifyContent = "center";
      container.style.boxSizing = "border-box";
      container.style.overflow = "hidden";
      container.style.overscrollBehavior = "contain";
      var diagram = container.querySelector(".mermaid");
      if (diagram) {
        var svg = diagram.querySelector("svg");
        if (svg) svg.style.background = "transparent";
      }
    }

    function clearFullscreenStyles(container) {
      var styles = [
        "position", "inset", "zIndex", "width", "height", "margin", "padding",
        "border", "borderRadius", "background", "display", "alignItems",
        "justifyContent", "boxSizing", "overflow", "overscrollBehavior",
      ];
      for (var i = 0; i < styles.length; i += 1) {
        container.style[styles[i]] = "";
      }
    }

    function enterOverlay(container) {
      if (activeOverlayContainer && activeOverlayContainer !== container) {
        exitOverlay(activeOverlayContainer);
      }
      previousBodyOverflow = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      applyFullscreenStyles(container);
      if (typeof hooks.onEnter === "function") hooks.onEnter(container);
      container.dataset.overlayEnabled = "true";
      activeOverlayContainer = container;
      setButtonState(container, true);
      document.addEventListener("keydown", handleKeydown, true);
    }

    function exitOverlay(container) {
      container = container || activeOverlayContainer;
      if (!container) return;
      if (typeof hooks.onExit === "function") hooks.onExit(container);
      clearFullscreenStyles(container);
      container.dataset.overlayEnabled = "false";
      setButtonState(container, false);
      if (activeOverlayContainer === container) {
        activeOverlayContainer = null;
        document.body.style.overflow = previousBodyOverflow;
        document.removeEventListener("keydown", handleKeydown, true);
      }
    }

    function handleKeydown(event) {
      if (event.key === "Escape" && activeOverlayContainer) {
        event.preventDefault();
        event.stopImmediatePropagation();
        exitOverlay(activeOverlayContainer);
      }
    }

    function toggle(container) {
      if (!container) return;
      if (container.dataset.overlayEnabled === "true") {
        exitOverlay(container);
      } else {
        enterOverlay(container);
      }
    }

    function isActive(container) {
      return !!container && container.dataset.overlayEnabled === "true";
    }

    function addButtons(root) {
      root = root || document;
      var containers = root.querySelectorAll(".mermaid-container");
      containers.forEach(function (container) {
        if (container.querySelector(".mermaid-fullscreen-btn")) {
          setButtonState(container, isActive(container));
          return;
        }
        var button = document.createElement("button");
        button.type = "button";
        button.className = "mermaid-fullscreen-btn";
        button.title = "Enter fullscreen";
        button.setAttribute("aria-label", "Enter fullscreen");
        button.setAttribute("aria-pressed", "false");
        button.innerHTML = EXPAND_ICON;
        container.appendChild(button);
        container.dataset.overlayEnabled = "false";
      });
    }

    window.mdopenMermaidOverlay = {
      addButtons: addButtons,
      enter: enterOverlay,
      exit: exitOverlay,
      toggle: toggle,
      isActive: isActive,
      setHooks: function (next) {
        if (next && typeof next.onEnter === "function") hooks.onEnter = next.onEnter;
        if (next && typeof next.onExit === "function") hooks.onExit = next.onExit;
      },
    };

    document.addEventListener("click", function (event) {
      if (!event.target || !event.target.closest) return;
      var button = event.target.closest(".mermaid-fullscreen-btn");
      if (!button) return;
      var container = button.closest(".mermaid-container");
      if (!container) return;
      event.preventDefault();
      toggle(container);
    });
  })();
</script>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  var renderCounter = 0;

  function mermaidTheme() {
    return document.documentElement.dataset.mdopenTheme === "dark" ? "dark" : "default";
  }

  function initMermaid() {
    mermaid.initialize({
      startOnLoad: false,
      theme: mermaidTheme(),
      securityLevel: "strict",
      fontFamily: "ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
    });
  }

  function prepareMermaidDiagram(container) {
    disableMermaidPanZoom(container);
    var diagram = container.querySelector(".mermaid");
    if (!diagram) return null;

    if (!diagram.dataset.source) {
      diagram.dataset.source = diagram.textContent || "";
    }

    diagram.classList.remove("mermaid-error");
    diagram.removeAttribute("data-processed");
    diagram.textContent = diagram.dataset.source;
    return diagram;
  }

  function mermaidErrorMessage(error) {
    if (error && error.str) return error.str;
    if (error && error.message) return error.message;
    return String(error || "Unknown Mermaid error");
  }

  function showMermaidError(diagram, error) {
    diagram.classList.add("mermaid-error");
    diagram.textContent = "Mermaid render failed: " + mermaidErrorMessage(error);
  }

  async function renderMermaid() {
    initMermaid();
    var overlay = window.mdopenMermaidOverlay;
    if (overlay) overlay.exit();
    var containers = Array.prototype.slice.call(document.querySelectorAll(".mermaid-container"));

    for (var i = 0; i < containers.length; i += 1) {
      var diagram = prepareMermaidDiagram(containers[i]);
      if (!diagram) continue;

      try {
        var result = await mermaid.render(diagram.id + "-svg-" + (++renderCounter), diagram.dataset.source || "");
        diagram.innerHTML = result.svg;
        if (result.bindFunctions) {
          result.bindFunctions(diagram);
        }
      } catch (error) {
        showMermaidError(diagram, error);
      }
    }

    if (overlay) overlay.addButtons(document);
  }

  function getTransform(scale, translate) {
    return "translate(" + translate.x + "px, " + translate.y + "px) scale(" + scale + ")";
  }

  function getFitScale(container, diagram) {
    var rect = diagram.getBoundingClientRect();
    if (!rect.width || !rect.height) return 1;

    var fitX = window.innerWidth * 0.9 / rect.width;
    var fitY = window.innerHeight * 0.9 / rect.height;
    return Math.max(0.2, Math.min(8, Math.min(fitX, fitY)));
  }

  function applyMermaidPanZoom(state) {
    state.diagram.style.transform = getTransform(state.scale, state.translate);
  }

  function fitMermaidPanZoom(container) {
    var state = container._mdopenMermaidPanZoom;
    if (!state) return;
    state.scale = getFitScale(container, state.diagram);
    state.translate = { x: 0, y: 0 };
    state.diagram.style.transition = "transform 100ms ease-out";
    applyMermaidPanZoom(state);
  }

  function enableMermaidPanZoom(container) {
    if (container._mdopenMermaidPanZoom) {
      fitMermaidPanZoom(container);
      return;
    }

    var diagram = container.querySelector(".mermaid");
    if (!diagram) return;

    var state = {
      diagram: diagram,
      scale: getFitScale(container, diagram),
      translate: { x: 0, y: 0 },
      dragging: false,
      dragStart: { x: 0, y: 0 },
      lastTouchDistance: 0
    };

    container.style.cursor = "grab";
    container.style.touchAction = "none";
    diagram.style.cursor = "grab";
    diagram.style.userSelect = "none";
    diagram.style.touchAction = "none";
    diagram.style.transformOrigin = "center center";
    diagram.style.transition = "transform 100ms ease-out";
    applyMermaidPanZoom(state);

    function isButtonEvent(event) {
      return event.target && event.target.closest && event.target.closest(".mermaid-fullscreen-btn");
    }

    function wheel(event) {
      event.preventDefault();
      var step = state.scale * (event.ctrlKey ? 0.15 : 0.1);
      var direction = event.deltaY > 0 ? -1 : 1;
      state.scale = Math.max(0.1, Math.min(20, state.scale + direction * step));
      applyMermaidPanZoom(state);
    }

    function mouseDown(event) {
      if (event.button !== 0 || isButtonEvent(event)) return;
      event.preventDefault();
      state.dragging = true;
      state.dragStart = {
        x: event.clientX - state.translate.x,
        y: event.clientY - state.translate.y
      };
      container.style.cursor = "grabbing";
      diagram.style.cursor = "grabbing";
      diagram.style.transition = "";
    }

    function mouseMove(event) {
      if (!state.dragging) return;
      state.translate.x = event.clientX - state.dragStart.x;
      state.translate.y = event.clientY - state.dragStart.y;
      applyMermaidPanZoom(state);
    }

    function mouseUp() {
      if (!state.dragging) return;
      state.dragging = false;
      container.style.cursor = "grab";
      diagram.style.cursor = "grab";
      diagram.style.transition = "transform 100ms ease-out";
    }

    function touchDistance(touches) {
      var a = touches[0];
      var b = touches[1];
      return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
    }

    function touchStart(event) {
      if (isButtonEvent(event)) return;
      if (event.touches.length === 2) {
        state.lastTouchDistance = touchDistance(event.touches);
      } else if (event.touches.length === 1) {
        var touch = event.touches[0];
        state.dragging = true;
        state.dragStart = {
          x: touch.clientX - state.translate.x,
          y: touch.clientY - state.translate.y
        };
      }
    }

    function touchMove(event) {
      event.preventDefault();
      if (event.touches.length === 2) {
        var distance = touchDistance(event.touches);
        if (state.lastTouchDistance > 0) {
          var delta = distance > state.lastTouchDistance ? 1 : -1;
          state.scale = Math.max(0.1, Math.min(20, state.scale + delta * state.scale * 0.1));
          applyMermaidPanZoom(state);
        }
        state.lastTouchDistance = distance;
      } else if (event.touches.length === 1 && state.dragging) {
        var touch = event.touches[0];
        state.translate.x = touch.clientX - state.dragStart.x;
        state.translate.y = touch.clientY - state.dragStart.y;
        applyMermaidPanZoom(state);
      }
    }

    function touchEnd() {
      state.dragging = false;
      state.lastTouchDistance = 0;
    }

    function doubleClick(event) {
      if (isButtonEvent(event)) return;
      state.scale = getFitScale(container, diagram);
      state.translate = { x: 0, y: 0 };
      diagram.style.transition = "transform 220ms ease-out";
      applyMermaidPanZoom(state);
    }

    container.addEventListener("wheel", wheel, { passive: false });
    container.addEventListener("mousedown", mouseDown);
    document.addEventListener("mousemove", mouseMove);
    document.addEventListener("mouseup", mouseUp);
    container.addEventListener("touchstart", touchStart, { passive: false });
    container.addEventListener("touchmove", touchMove, { passive: false });
    container.addEventListener("touchend", touchEnd);
    container.addEventListener("dblclick", doubleClick);

    state.cleanup = function () {
      container.removeEventListener("wheel", wheel);
      container.removeEventListener("mousedown", mouseDown);
      document.removeEventListener("mousemove", mouseMove);
      document.removeEventListener("mouseup", mouseUp);
      container.removeEventListener("touchstart", touchStart);
      container.removeEventListener("touchmove", touchMove);
      container.removeEventListener("touchend", touchEnd);
      container.removeEventListener("dblclick", doubleClick);
    };

    container._mdopenMermaidPanZoom = state;
  }

  function disableMermaidPanZoom(container) {
    var state = container._mdopenMermaidPanZoom;
    if (state && state.cleanup) {
      state.cleanup();
    }

    var diagram = container.querySelector(".mermaid");
    if (diagram) {
      diagram.style.transform = "";
      diagram.style.transformOrigin = "";
      diagram.style.transition = "";
      diagram.style.cursor = "";
      diagram.style.userSelect = "";
      diagram.style.touchAction = "";
    }

    container.style.cursor = "";
    container.style.touchAction = "";
    delete container._mdopenMermaidPanZoom;
  }

  if (window.mdopenMermaidOverlay) {
    window.mdopenMermaidOverlay.setHooks({
      onEnter: enableMermaidPanZoom,
      onExit: disableMermaidPanZoom,
    });
  }

  document.addEventListener("mdopen-theme-change", renderMermaid);
  await renderMermaid();
</script>
